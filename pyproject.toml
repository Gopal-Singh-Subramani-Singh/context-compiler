[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "context-compiler"
version = "0.18.0"
description = "A local-first compiler and static-analysis foundation for model context."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Context Compiler contributors" }]
dependencies = []

[project.optional-dependencies]
tokenizers = ["tokenizers>=0.19"]
qwen = ["transformers>=4.44", "jinja2>=3.1"]
llama = ["transformers>=4.44", "jinja2>=3.1"]
embeddings = ["sentence-transformers>=3"]
ilp = ["pulp>=2.8"]
ui = ["streamlit>=1.36"]
live-mcp = ["mcp>=2.1,<3"]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5",
  "pulp>=2.8",
  "ruff>=0.6",
  "setuptools>=77",
  "twine>=5.1",
  "mcp>=2.1,<3",
]

[project.scripts]
contextc = "contextc.cli.main:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["contextc", "contextc.*"]
namespaces = false

[tool.setuptools.package-data]
contextc = [
  "py.typed",
  "resources/security/**/*",
  "resources/capabilities/**/*",
  "resources/release_demos/**/*",
  "resources/demos/incidents/*/public/**/*",
  "demos/live_mcp/plans/*.json",
]


[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo", "**/.DS_Store"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Constructing LpVariable.*:DeprecationWarning",
  "ignore:PULP_CBC_CMD is deprecated.*:DeprecationWarning",
]
markers = [
  "live_mcp: requires the optional live-mcp SDK and launches the bounded local stdio fixture",
]

[tool.coverage.run]
branch = true
source = ["contextc"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
extend-exclude = ["contextc/resources/release_demos/**/files/**"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["contextc"]

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*"]
ignore_missing_imports = true
